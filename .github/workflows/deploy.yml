
name: Deploy mdc-to-unicode to IONOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy static website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check IONOS configuration
        env:
          IONOS_USERNAME: ${{ secrets.IONOS_USERNAME }}
          IONOS_HOST: ${{ secrets.IONOS_HOST }}
          IONOS_PORT: ${{ secrets.IONOS_PORT }}
          IONOS_TARGET: ${{ secrets.IONOS_TARGET }}
        run: |
          echo "Checking IONOS configuration..."

          for VAR in IONOS_USERNAME IONOS_HOST IONOS_PORT IONOS_TARGET; do
            if [ -z "${!VAR}" ]; then
              echo "ERROR: $VAR is empty"
              exit 1
            fi
          done

          echo "Username length: ${#IONOS_USERNAME}"
          echo "Username prefix: ${IONOS_USERNAME:0:2}"
          echo "Host configured: YES"
          echo "Port configured: $IONOS_PORT"
          echo "Target configured: YES"
          echo "Configuration looks correct"

      - name: Deploy to IONOS via SCP
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.IONOS_HOST }}
          username: ${{ secrets.IONOS_USERNAME }}
          password: ${{ secrets.IONOS_PASSWORD }}
          port: ${{ secrets.IONOS_PORT }}
          source: "./*"
          target: ${{ secrets.IONOS_TARGET }}
          overwrite: true
