
name: Deploy mdc-to-unicode to IONOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy static website
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Comprobar los secretos de IONOS
      - name: Check IONOS configuration
        env:
          IONOS_USER: ${{ secrets.IONOS_USER }}
          IONOS_HOST: ${{ secrets.IONOS_HOST }}
          IONOS_PORT: ${{ secrets.IONOS_PORT }}
        run: |
          echo "Checking IONOS configuration..."

          if [ -z "$IONOS_USER" ]; then
            echo "ERROR: IONOS_USER is empty"
            exit 1
          fi

          if [ -z "$IONOS_HOST" ]; then
            echo "ERROR: IONOS_HOST is empty"
            exit 1
          fi

          echo "Username length: ${#IONOS_USER}"
          echo "Username prefix: ${IONOS_USER:0:2}"
          echo "Host configured: YES"
          echo "Port configured: $IONOS_PORT"

          if [[ "$IONOS_USER" =~ [[:space:]] ]]; then
            echo "ERROR: Username contains whitespace"
            exit 1
          fi

          echo "Configuration looks correct"

      # 3. Probar conexión SSH
      - name: Test IONOS SSH connection
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.IONOS_HOST }}
          username: ${{ secrets.IONOS_USER }}
          password: ${{ secrets.IONOS_PASSWORD }}
          port: ${{ secrets.IONOS_PORT }}
          script: |
            echo "IONOS SSH connection successful"
            whoami
            pwd

      # 4. Desplegar archivos
      - name: Deploy to IONOS via SCP
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.IONOS_HOST }}
          username: ${{ secrets.IONOS_USER }}
          password: ${{ secrets.IONOS_PASSWORD }}
          port: ${{ secrets.IONOS_PORT }}
          source: "./*"
          target: ${{ secrets.IONOS_TARGET }}
          overwrite: true
